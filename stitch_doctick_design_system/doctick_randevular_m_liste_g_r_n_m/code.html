<body class="bg-surface-page min-h-screen text-on-surface font-body-md antialiased">
<!-- TopNavBar (Patient Shell) -->
<header class="bg-[#164478] w-full sticky top-0 z-50 shadow-sm">
<div class="max-w-max-width-patient mx-auto px-page-pad h-16 flex items-center justify-between">
<!-- Brand -->
<div class="flex items-center gap-8">
<a href="#" class="font-display text-on-primary text-[24px] font-bold tracking-tight">DocTick</a>
<!-- Navigation Links -->
<nav class="hidden md:flex items-center gap-2">
<a href="#" class="px-3 py-1.5 rounded-full text-on-primary/80 font-label text-label hover:text-on-primary hover:bg-white/5 transition-colors">Ana sayfa</a>
<a href="#" class="px-3 py-1.5 rounded-full text-on-primary/80 font-label text-label hover:text-on-primary hover:bg-white/5 transition-colors">Randevu al</a>
<a href="#" class="px-3 py-1.5 rounded-full bg-white/14 text-on-primary font-label text-label transition-colors">Randevularım</a>
<a href="#" class="px-3 py-1.5 rounded-full text-on-primary/80 font-label text-label hover:text-on-primary hover:bg-white/5 transition-colors">İletişim</a>
</nav>
</div>
<!-- User Actions -->
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 text-on-primary cursor-pointer hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-xl" data-icon="account_circle">account_circle</span>
<span class="font-label text-label hidden sm:block">Elif Yurt</span>
</div>
<button class="text-on-primary/80 hover:text-on-primary transition-colors flex items-center" aria-label="Çıkış yap">
<span class="material-symbols-outlined" data-icon="logout">logout</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="max-w-max-width-patient mx-auto px-page-pad py-8 md:py-12">
<!-- Header Section -->
<div class="mb-stack-gap">
<h1 class="font-h1 text-h1 text-on-surface">Randevularım</h1>
<p class="font-body-md text-body-md text-text-muted mt-1">Gelecek ve geçmiş tüm randevu kayıtlarınız.</p>
</div>
<!-- Content Card -->
<div class="bg-surface-card rounded-[10px] shadow-sm border border-border-soft overflow-hidden">
<!-- Tabs -->
<div class="flex border-b border-border-soft px-4 bg-white">
<button class="px-6 py-4 border-b-2 border-primary-container text-primary-container font-label text-label font-bold transition-colors">Yaklaşan</button>
<button class="px-6 py-4 border-b-2 border-transparent text-text-muted font-label text-label hover:text-on-surface transition-colors">Geçmiş</button>
<button class="px-6 py-4 border-b-2 border-transparent text-text-muted font-label text-label hover:text-on-surface transition-colors">İptal edilen</button>
</div>
<!-- List Container -->
<div class="flex flex-col bg-white">
<!-- Appointment Row 1 -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between p-card-pad border-b border-border-soft hover:bg-surface-sunken/50 transition-colors gap-4 sm:gap-6">
<div class="flex items-start sm:items-center gap-4 sm:gap-6 flex-1">
<!-- Time Slot -->
<div class="flex-shrink-0 w-20 pt-1 sm:pt-0">
<span class="font-time text-time text-primary-container block">09:30</span>
</div>
<!-- Details -->
<div class="flex flex-col flex-1">
<div class="flex flex-wrap items-center gap-3 mb-1">
<h3 class="font-h3 text-h3 text-on-surface">Uzm. Dr. Ayşe Demir</h3>
<!-- Status Badge -->
<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-status-confirmed-bg text-status-confirmed font-label text-[11px] font-bold uppercase tracking-wider">
<span class="w-1.5 h-1.5 rounded-full bg-status-confirmed"></span>
                                    Onaylandı
                                </span>
</div>
<div class="font-body-sm text-body-sm text-text-muted flex items-center flex-wrap gap-2">
<span>Kardiyoloji</span>
<span class="w-1 h-1 rounded-full bg-border-default"></span>
<span>24 Tem 2026</span>
<span class="w-1 h-1 rounded-full bg-border-default"></span>
<span class="font-time text-[13px]">RND-2026-0007</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex-shrink-0 flex items-center justify-end">
<button class="px-4 py-2 bg-[#C03B36] hover:bg-[#A3322E] text-white font-label text-label rounded transition-colors shadow-sm whitespace-nowrap">
                            İptal et
                        </button>
</div>
</div>
<!-- Appointment Row 2 -->
<div class="flex flex-col sm:flex-row sm:items-center justify-between p-card-pad hover:bg-surface-sunken/50 transition-colors gap-4 sm:gap-6">
<div class="flex items-start sm:items-center gap-4 sm:gap-6 flex-1">
<!-- Time Slot -->
<div class="flex-shrink-0 w-20 pt-1 sm:pt-0">
<span class="font-time text-time text-primary-container block">11:00</span>
</div>
<!-- Details -->
<div class="flex flex-col flex-1">
<div class="flex flex-wrap items-center gap-3 mb-1">
<h3 class="font-h3 text-h3 text-on-surface">Doç. Dr. Mehmet Kaya</h3>
<!-- Status Badge -->
<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-status-confirmed-bg text-status-confirmed font-label text-[11px] font-bold uppercase tracking-wider">
<span class="w-1.5 h-1.5 rounded-full bg-status-confirmed"></span>
                                    Onaylandı
                                </span>
</div>
<div class="font-body-sm text-body-sm text-text-muted flex items-center flex-wrap gap-2">
<span>Dermatoloji</span>
<span class="w-1 h-1 rounded-full bg-border-default"></span>
<span>27 Tem 2026</span>
<span class="w-1 h-1 rounded-full bg-border-default"></span>
<span class="font-time text-[13px]">RND-2026-0011</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex-shrink-0 flex items-center justify-end">
<button class="px-4 py-2 bg-[#C03B36] hover:bg-[#A3322E] text-white font-label text-label rounded transition-colors shadow-sm whitespace-nowrap">
                            İptal et
                        </button>
</div>
</div>
</div>
</div>
