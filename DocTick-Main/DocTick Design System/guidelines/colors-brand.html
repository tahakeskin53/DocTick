<html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:#fff}.row{display:flex;gap:6px}.sw{flex:1;height:72px;border-radius:8px;display:flex;align-items:flex-end;padding:6px;font:500 10px var(--font-mono)}.lbl{display:flex;gap:6px;margin-top:6px}.lbl span{flex:1;text-align:center;font:var(--text-caption);color:var(--text-muted)}</style></head><body>
<div class="row">
<div class="sw" style="background:var(--blue-50);color:#164478">50</div>
<div class="sw" style="background:var(--blue-100);color:#164478">100</div>
<div class="sw" style="background:var(--blue-200);color:#164478">200</div>
<div class="sw" style="background:var(--blue-300);color:#0E2A4A">300</div>
<div class="sw" style="background:var(--blue-400);color:#fff">400</div>
<div class="sw" style="background:var(--blue-500);color:#fff">500</div>
<div class="sw" style="background:var(--blue-600);color:#fff;outline:2px solid var(--ink-900);outline-offset:2px">600</div>
<div class="sw" style="background:var(--blue-700);color:#fff">700</div>
<div class="sw" style="background:var(--blue-800);color:#fff">800</div>
<div class="sw" style="background:var(--blue-900);color:#fff">900</div>
</div>
</body></html>
