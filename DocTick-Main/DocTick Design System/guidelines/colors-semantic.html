<!-- @dsCard group="Colors" viewport="700x170" name="Semantik aliaslar" subtitle="Metin, zemin, çizgi rolleri" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--surface-page);display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font:var(--text-body-sm)}.cell{background:var(--surface-card);border:1px solid var(--border-soft);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px}.dot{width:16px;height:16px;border-radius:5px;border:1px solid var(--border-soft)}code{font:500 11px var(--font-mono);color:var(--text-muted)}</style></head><body>
<div class="cell"><span class="dot" style="background:var(--brand)"></span><code>--brand</code></div>
<div class="cell"><span class="dot" style="background:var(--text-body)"></span><code>--text-body</code></div>
<div class="cell"><span class="dot" style="background:var(--text-secondary)"></span><code>--text-secondary</code></div>
<div class="cell"><span class="dot" style="background:var(--surface-page)"></span><code>--surface-page</code></div>
<div class="cell"><span class="dot" style="background:var(--surface-card)"></span><code>--surface-card</code></div>
<div class="cell"><span class="dot" style="background:var(--surface-sunken)"></span><code>--surface-sunken</code></div>
<div class="cell"><span class="dot" style="background:var(--border-default)"></span><code>--border-default</code></div>
<div class="cell"><span class="dot" style="background:var(--brand-soft)"></span><code>--brand-soft</code></div>
<div class="cell"><span class="dot" style="background:var(--surface-brand)"></span><code>--surface-brand</code></div>
</body></html>
