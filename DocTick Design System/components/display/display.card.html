<!-- @dsCard group="Components" viewport="700x300" name="Görüntüleme" subtitle="Card, Badge, Rating, TimeSlot" -->
<html><head><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:16px;background:var(--surface-page)}</style></head><body><div id="root"></div>
<script type="text/babel">
const {Card,Badge,Rating,TimeSlot,Button}=window.DocTickDesignSystem_a9eaee;
function Demo(){
  const [sel,setSel]=React.useState('09:30');
  const [puan,setPuan]=React.useState(4);
  return <div style={{display:'flex',gap:14,alignItems:'flex-start'}}>
    <Card title="Uygun saatler" style={{flex:1.2}}>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        {['09:00','09:30','10:00','10:30'].map(t=><TimeSlot key={t} time={t} state={t==='10:00'?'full':sel===t?'selected':'available'} onClick={()=>setSel(t)}/>)}
      </div>
    </Card>
    <div style={{flex:1,display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
        <Badge status="confirmed">Onaylandı</Badge><Badge status="pending">Bekliyor</Badge><Badge status="cancelled">İptal edildi</Badge><Badge status="done">Tamamlandı</Badge>
      </div>
      <Card title="Hizmeti değerlendirin" footer={<Button size="sm">Gönder</Button>}>
        <Rating value={puan} onChange={setPuan}/>
      </Card>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
