<!-- @dsCard group="Colors" viewport="700x150" name="Randevu durum renkleri" subtitle="Onaylı / bekliyor / iptal / tamamlandı" -->
<html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:#fff;display:flex;gap:10px}.st{flex:1;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}.b{align-self:flex-start;font:var(--text-overline);letter-spacing:var(--overline-tracking);padding:4px 10px;border-radius:999px}.t{font:500 11px var(--font-mono)}</style></head><body>
<div class="st" style="background:var(--status-confirmed-bg)"><span class="b" style="background:var(--status-confirmed);color:#fff">ONAYLANDI</span><span class="t" style="color:var(--status-confirmed)">--status-confirmed</span></div>
<div class="st" style="background:var(--status-pending-bg)"><span class="b" style="background:var(--status-pending);color:#fff">BEKLİYOR</span><span class="t" style="color:var(--status-pending)">--status-pending</span></div>
<div class="st" style="background:var(--status-cancelled-bg)"><span class="b" style="background:var(--status-cancelled);color:#fff">İPTAL EDİLDİ</span><span class="t" style="color:var(--status-cancelled)">--status-cancelled</span></div>
<div class="st" style="background:var(--status-done-bg)"><span class="b" style="background:var(--status-done);color:#fff">TAMAMLANDI</span><span class="t" style="color:var(--status-done)">--status-done</span></div>
</body></html>
