name: Deploy and Set App Settings

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.x'

      - name: Restore & Build backend
        run: |
          cd backend
          dotnet restore
          dotnet publish -c Release -o publish

      - name: Build frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Package for deploy
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/* publish/wwwroot/ || true
          cd backend
          zip -r ../artifact.zip publish || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: artifact.zip

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          slot-name: production
          package: artifact.zip

      - name: Set App Settings from Secrets
        uses: azure/CLI@v1
        with:
          azcliversion: 3.0.0
          inlineScript: |
            az webapp config appsettings set --name ${{ secrets.AZURE_WEBAPP_NAME }} --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} --settings \
              Resend__ApiKey="${{ secrets.RESEND_API_KEY }}" \
              Resend__FromEmail="${{ secrets.RESEND_FROM_EMAIL }}" \
              Google__ClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
              Google__ClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              AZURE_KEYVAULT_URI="${{ secrets.KEYVAULT_URI }}"

      - name: Post-deploy note
        run: echo "Deployed and app settings updated. Ensure secrets exist in repo Settings → Secrets → Actions."
